<!doctype html>
<html lang="fr" data-facebook-pixel-enabled="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="facebook-pixel-enabled" content="true">
  <title>Test du pixel Meta</title>

  <!--
    Interrupteur du pixel Meta pour GTM.
    Pour désactiver le pixel, remplacer les trois valeurs true par false :
    1) data-facebook-pixel-enabled sur <html>
    2) content de la balise meta ci-dessus
    3) facebook_pixel_enabled dans le dataLayer ci-dessous
  -->
  <script>
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      facebook_pixel_enabled: 'true'
    });
  </script>

  <!-- Google Tag Manager -->
  <script>
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),
          dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;
      j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-WGL79Z');
  </script>
  <!-- End Google Tag Manager -->
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WGL79Z"
            height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main>
    <p>Text test</p>
  </main>
</body>
</html>
